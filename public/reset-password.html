<!doctype html>
<html lang="en">
  <head>
    <title>Reset password – 12 Movies of Christmas</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <canvas id="snow" aria-hidden="true"></canvas>
    <main class="login">
      <h1>Reset password</h1>
      <form id="reset-password-form">
        <label for="reset-new-password">
          New password
          <input
            id="reset-new-password"
            type="password"
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
            required
          >
        </label>
        <label for="reset-confirm-password">
          Confirm new password
          <input
            id="reset-confirm-password"
            type="password"
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
            required
          >
        </label>
        <button class="btn" type="submit">Save password</button>
        <p id="reset-status" role="status"></p>
        <p id="reset-error" class="err" role="alert"></p>
      </form>
      <p class="small"><a href="/">Back to login</a></p>
    </main>
    <script src="js/api.js"></script>
    <script src="js/password-toggle.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/reset-password.js"></script>
  </body>
</html>
