<!doctype html>
<html lang="en">
  <head>
    <title>Create an account · 12 Movies of Christmas</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <canvas id="snow" aria-hidden="true"></canvas>
    <div id="lights" aria-hidden="true"></div>
    <main class="login">
      <h1>🎄 12 Movies of Christmas</h1>
      <p>Create an account to open today's door.</p>
      <form id="rf">
        <label>
          First name
          <input id="first" autocomplete="given-name" required>
        </label>
        <label>
          Last name
          <input id="last" autocomplete="family-name" required>
        </label>
        <label>
          Email
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label>
          Username
          <input id="u" autocomplete="username" required>
        </label>
        <label>
          Password
          <input
            id="p"
            type="password"
            autocomplete="new-password"
            minlength="12"
            maxlength="72"
            required
          >
        </label>
        <label>
          Repeat password
          <input
            id="confirm-password"
            type="password"
            autocomplete="new-password"
            minlength="12"
            maxlength="72"
            required
          >
        </label>
        <button class="btn">Create account</button>
        <p id="err" class="err" role="alert"></p>
      </form>
      <p class="small">
        <a href="index.html">Already have an account? Log in</a>
      </p>
    </main>
    <script src="js/api.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
