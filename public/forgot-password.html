<!doctype html>
<html lang="en">
  <head>
    <title>Forgot password – 12 Movies of Christmas</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <canvas id="snow" aria-hidden="true"></canvas>
    <main class="login">
      <h1>Forgot password?</h1>
      <p>Enter the email address on your account.</p>
      <form id="forgot-password-form">
        <label for="forgot-email">
          Email
          <input
            id="forgot-email"
            name="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            required
          >
        </label>
        <button class="btn" type="submit">Send reset link</button>
        <p id="forgot-status" role="status"></p>
        <p id="forgot-error" class="err" role="alert"></p>
      </form>
      <p class="small"><a href="/">Back to login</a></p>
    </main>
    <script src="js/api.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/forgot-password.js"></script>
  </body>
</html>
