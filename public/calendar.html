<!doctype html>
<html lang="en">
  <head>
    <title>12 Movies of Christmas</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <canvas id="snow" aria-hidden="true"></canvas>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <div id="lights" aria-hidden="true"></div>

    <header class="top">
      <h1><button id="sleigh-trigger" class="title-trigger" type="button" aria-label="12 Movies of Christmas — make Santa fly by with sleigh bells">12 Movies of Christmas</button></h1>
      <div class="tools">
        <span id="hello"></span>
        <a id="admin-dashboard-link" class="btn admin-calendar-link" href="admin.html" hidden>Back to dashboard</a>
        <button
          id="profile-toggle"
          class="icon profile-toggle"
          type="button"
          aria-label="Show profile"
          aria-controls="profile-sidebar"
          aria-expanded="false"
        >
          <span id="profile-toggle-avatar" aria-hidden="true"></span>
        </button>
        <div id="settings" class="settings">
          <button
            id="settings-toggle"
            class="icon"
            aria-label="Open settings"
            aria-controls="settings-panel"
            aria-expanded="false"
          >
            <span aria-hidden="true">☰</span>
          </button>
          <section
            id="settings-panel"
            class="settings-panel"
            aria-label="Settings"
            hidden
          >
            <h2>Settings</h2>
            <div class="settings-controls">
              <button id="mute" class="icon" aria-label="Mute sounds">🔊</button>
              <button
                id="music"
                class="icon"
                aria-label="Toggle background music"
                aria-pressed="false"
              >
                🎵
              </button>
              <label for="vol">
                Volume
                <input
                  id="vol"
                  type="range"
                  min="0"
                  max="1"
                  step=".05"
                  aria-label="Volume"
                >
              </label>
              <button
                id="calm"
                class="icon"
                aria-label="Reduce motion"
                aria-pressed="false"
              >
                🐢
              </button>
              <button
                id="theme"
                class="icon"
                aria-label="Change background colour"
              >
                🎨
              </button>
            </div>
          </section>
        </div>
        <button id="out" class="icon" aria-label="Log out">🚪</button>
      </div>
    </header>
    <div id="sleigh" aria-hidden="true">
      <svg viewBox="0 0 270 110" role="presentation">
        <path d="M58 67h127l-15 24H85z" fill="#e0213f" stroke="#1b1b1b" stroke-width="6" stroke-linejoin="round"/>
        <path d="M81 91q55 18 105-2" fill="none" stroke="#f5c542" stroke-width="7" stroke-linecap="round"/>
        <circle cx="92" cy="61" r="20" fill="#fff7e6" stroke="#1b1b1b" stroke-width="5"/>
        <circle cx="92" cy="61" r="11" fill="#e0213f"/>
        <path d="M87 49q-8-19 10-25 16 7 11 25M88 57h18M96 53v16" fill="#fff7e6" stroke="#1b1b1b" stroke-width="4" stroke-linejoin="round"/>
        <path d="M188 55q20-18 37-3l11 1-5 10 5 8-20 1-10 14-8-2 4-15-13-3z" fill="#fff7e6" stroke="#1b1b1b" stroke-width="4" stroke-linejoin="round"/>
        <path d="M211 50l-5-15 12 9 10-12 1 19M218 57h2" fill="none" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M174 51q18-17 32-1M177 66q17-5 27 3M162 46q7-11 13-9" fill="none" stroke="#f5c542" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="wave"></div>
    <div class="calendar-layout profile-hidden">
      <aside id="profile-sidebar" class="profile-sidebar" aria-labelledby="profile-title">
        <div class="profile-heading">
          <div id="profile-avatar" class="profile-avatar" role="img"></div>
          <div>
            <h2 id="profile-title">Your profile</h2>
            <p id="profile-name" class="profile-name"></p>
          </div>
        </div>
        <section class="profile-details" aria-label="Account details">
          <h3>Account details</h3>
          <p><b>First name</b><span id="profile-first-name"></span></p>
          <p><b>Last name</b><span id="profile-last-name"></span></p>
          <p><b>Username</b><span id="profile-username"></span></p>
          <p><b>Email</b><span id="profile-email"></span></p>
        </section>
        <section class="profile-progress" aria-labelledby="progress-title">
          <h3 id="progress-title">Movie progress</h3>
          <p id="progress-summary" class="progress-summary"></p>
          <progress id="watched-progress" max="100" value="0" aria-label="Movies watched"></progress>
          <p id="progress-percent" class="progress-percent"></p>
        </section>
        <section class="profile-avatars" aria-labelledby="avatar-title">
          <h3 id="avatar-title">Choose your picture</h3>
          <div id="avatar-options" class="avatar-options" role="group" aria-label="Profile picture options"></div>
          <p id="avatar-status" class="avatar-status" role="status"></p>
        </section>
      </aside>
      <main class="calendar-content">
        <div id="banner" class="banner" hidden></div>
        <div id="grid" class="grid"></div>
      </main>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div
      id="modal"
      class="modal"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="mt"
    >
      <div class="card">
        <button id="close" class="icon" aria-label="Close">✕</button>
        <div id="mbody" class="mbody"></div>
      </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/calendar.js"></script>
  </body>
</html>
