<!doctype html>
<html lang="en">
  <head>
    <title>Change password – 12 Movies of Christmas</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <canvas id="snow" aria-hidden="true"></canvas>
    <main class="login password-page">
      <h1>🔑 Change password</h1>
      <p id="welcome">Choose a password for your account.</p>
      <form id="password-form">
        <label for="current-password">
          Current password
          <input
            id="current-password"
            name="currentPassword"
            type="password"
            autocomplete="current-password"
            required
          >
        </label>
        <label for="new-password">
          New password
          <input
            id="new-password"
            name="newPassword"
            type="password"
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
            required
          >
        </label>
        <label for="confirm-password">
          Confirm new password
          <input
            id="confirm-password"
            name="confirmPassword"
            type="password"
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
            required
          >
        </label>
        <button class="btn" type="submit">Save new password</button>
        <p id="password-status" role="status"></p>
        <p id="password-error" class="err" role="alert"></p>
      </form>
    </main>
    <script src="js/api.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/password.js"></script>
  </body>
</html>
